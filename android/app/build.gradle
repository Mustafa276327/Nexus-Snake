plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.snake'
    compileSdk 34
    defaultConfig {
        applicationId "com.nexus.snake"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Release signing: env vars (CI) or android/keystore.properties (local).
    // If neither is present the build still succeeds, but produces an unsigned APK.
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('keystore.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def releaseStoreFile = System.getenv('KEYSTORE_FILE') ?: signingProps.getProperty('storeFile')
    def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: signingProps.getProperty('storePassword')
    def releaseKeyAlias = System.getenv('KEY_ALIAS') ?: signingProps.getProperty('keyAlias')
    def releaseKeyPassword = System.getenv('KEY_PASSWORD') ?: signingProps.getProperty('keyPassword')
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Allow overriding version from command line
    if (project.hasProperty('versionCode')) {
        defaultConfig.versionCode = versionCode.toInteger()
    }
    if (project.hasProperty('versionName')) {
        defaultConfig.versionName = versionName
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation project(':capacitor-android')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (e) {
    // google-services plugin not applied
}