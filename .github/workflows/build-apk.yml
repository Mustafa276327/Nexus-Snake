# Nexus Snake - GitHub Actions APK Build Workflow
# Triggers on push to main and version tags (v*)
# Produces APK artifact and GitHub Release (unsigned if no keystore secrets)

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"'

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure signing (if secrets available)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/nexus-snake.jks
          echo "KEYSTORE_PATH=nexus-snake.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          cat >> android/app/build.gradle << 'EOF'

android {
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "nexus-snake.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
EOF

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${{ github.ref_name == 'main' && '1.0.0-dev' || github.ref_name }}

      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          file android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-snake-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          compression-level: 6

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus Snake ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Nexus Snake ${{ github.ref_name }}

            ### Features
            - 4 Game Modes: Classic, Timed, Survival, Maze
            - 6 Powerups: Speed Boost, Slow Down, Shrink, 2x Points, Ghost, Shield
            - 4 Themes: Dark, Light, Neon, Retro
            - Obstacles: Static walls, Moving blocks, Portals
            - Offline-first, no ads, no tracking
            - Touch, keyboard, and virtual D-pad controls

            ### Installation
            1. Download `Nexus-Snake-${{ github.ref_name }}.apk`
            2. Enable "Install unknown apps" for your browser/file manager
            3. Open the APK and install

            ### Build Info
            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk=app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}